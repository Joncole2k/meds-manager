# Meds Manager service descriptions.
# CGPT-STAMP: 2026-09-21 reliable-lifecycle
# Every documented service is registered in __init__.py and persists its result.

take:
  name: Take medication
  description: Records a dose, clears any snooze, reduces inventory by quantity, and immediately recalculates the schedule.
  fields:
    med_id:
      required: true
      selector:
        text:
    quantity:
      default: 1
      selector:
        number:
          min: 1
          mode: box

snooze:
  name: Snooze medication
  description: Temporarily suppresses reminders without changing the dose schedule.
  fields:
    med_id:
      required: true
      selector:
        text:
    minutes:
      required: true
      default: 60
      selector:
        number:
          min: 1
          max: 1440
          mode: box

refill:
  name: Refill medication
  description: Sets the current inventory count and clears the refill warning.
  fields:
    med_id:
      required: true
      selector:
        text:
    amount:
      required: true
      selector:
        number:
          min: 0
          mode: box

create_medication:
  name: Create medication
  description: Adds a medication, saves it, and creates its sensor without restarting Home Assistant.
  fields:
    med_id:
      required: true
      selector:
        text:
    common_name:
      required: true
      selector:
        text:
    person:
      required: true
      selector:
        text:
    interval_hours:
      required: true
      selector:
        number:
          min: 1
          max: 168
          mode: box
    generic_name:
      selector:
        text:
    brand_name:
      selector:
        text:
    current_count:
      default: 0
      selector:
        number:
          min: 0
          mode: box
    low_stock_threshold:
      default: 5
      selector:
        number:
          min: 0
          mode: box

delete_medication:
  name: Delete medication
  description: Permanently removes a medication and its sensor.
  fields:
    med_id:
      required: true
      selector:
        text:
